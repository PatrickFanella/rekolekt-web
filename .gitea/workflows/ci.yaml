name: Kit verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout kit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read pinned core revision
        id: core
        run: echo "revision=$(tr -d '[:space:]' < openapi/core-revision.txt)" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned core for the contract check
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: subculture-collective/rekolekt
          ref: ${{ steps.core.outputs.revision }}
          path: .core
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: OpenAPI contract
        env:
          REKOLEKT_CORE_DIR: .core
        run: npm run api:check
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Type check
        run: npm run type-check
      - name: Unit and component tests
        run: npm run test:coverage
      - name: Build package
        run: npm run build
      - name: Check published files
        run: npm run pack:check
      - name: Build example
        run: npx vite build --config examples/vite.config.ts
      - name: Dependency audit
        run: npm audit --audit-level=high

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout kit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read pinned core revision
        id: core
        run: echo "revision=$(tr -d '[:space:]' < openapi/core-revision.txt)" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: subculture-collective/rekolekt
          ref: ${{ steps.core.outputs.revision }}
          path: .core
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Integration tests against a disposable core API
        run: |
          set -euo pipefail
          # Jobs run in a container beside the Docker daemon; published ports
          # are reachable through this container's network gateway.
          gateway="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{println .Gateway}}{{end}}' "$(hostname)" | while IFS= read -r candidate; do
            [[ -n "$candidate" ]] && { printf '%s\n' "$candidate"; break; }
          done)"
          [[ "$gateway" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]
          REKOLEKT_CORE_DIR="$PWD/.core" REKOLEKT_IT_HOST="$gateway" integration/run.sh

  required:
    name: Required checks
    if: always()
    needs: [verify, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ['RESULTS'])
          required = {'verify', 'integration'}
          if not isinstance(results, dict) or set(results) != required:
              raise SystemExit('Required check inventory is incomplete or unexpected')
          failed = {name: job.get('result') if isinstance(job, dict) else 'invalid'
                    for name, job in results.items()
                    if not isinstance(job, dict) or job.get('result') != 'success'}
          if failed:
              raise SystemExit(f'Required checks did not pass: {failed}')
          print('All required checks passed')
          PY
